<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 패턴 플래시카드</title>
<style>
  :root { --bg:#fafaf7; --fg:#1f2430; --card:#ffffff; --line:#e3e3dc; --accent:#3b6ef5; --ok:#2e9d5b; --ng:#d0473b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --fg:#e8eaee; --card:#1d2027; --line:#2f333d; --accent:#7a9bff; --ok:#4cc58a; --ng:#ef6f63; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, button { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stat { font-size:14px; opacity:.75; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:220px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; }
  .tag { font-size:12px; opacity:.6; margin-bottom:12px; }
  .q { font-size:20px; line-height:1.5; }
  .a { font-size:20px; line-height:1.5; color:var(--accent); font-weight:600; }
  .hint { font-size:13px; opacity:.55; margin-top:14px; }
  .actions { display:flex; gap:10px; margin-top:12px; }
  .actions button { flex:1; padding:14px; font-weight:600; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
</style>
</head>
<body>
<div class="wrap">
  <h1>영어 패턴 플래시카드</h1>
  <div class="bar">
    <select id="set"></select>
    <button id="shuffle">섞기</button>
    <button id="reviewNg">모르는 것만</button>
    <button id="speak">🔊 읽기</button>
  </div>
  <p class="stat" id="stat"></p>
  <div class="card" id="card"></div>
  <div class="actions">
    <button class="ng" id="btnNg">다시 볼래요</button>
    <button class="ok" id="btnOk">외웠어요</button>
  </div>
</div>

<script>
// [그룹, 한글, 영어]
var CARDS = [
  ["패턴 1","제 이메일 확인해 보셨나요?","Did you get a chance to check my email?"],
  ["패턴 1","지난주 미팅 자료 확인해 보셨나요?","Did you get a chance to check the document from last week's meeting?"],
  ["패턴 1","오늘 아침에 보낸 이메일 확인해 보셨나요?","Did you get a chance to check the email I sent this morning?"],
  ["패턴 1","오늘 미팅 발표자료 확인해 보셨나요?","Did you get a chance to check today's meeting presentation?"],
  ["패턴 2","제가 요청드린 건에 대해 업데이트해 주시겠어요?","Could you update us on the request I sent?"],
  ["패턴 2","계약 건에 대해 업데이트해 주시겠어요?","Could you update us on the contract?"],
  ["패턴 3","협상에 대해 업데이트 있으세요?","Do you have any update on the negotiation?"],
  ["패턴 3","이메일로 보낸 요청 건 업데이트 있으세요?","Do you have any update on the request I sent you by email?"],
  ["패턴 3","카톡으로 보낸 요청 건 업데이트 있나요?","Any update on the request I sent via KakaoTalk?"],
  ["패턴 4","질문의 마지막 부분을 명확히 해 주시겠어요?","Could you clarify the last part of your question?"],
  ["패턴 4","죄송합니다. 다음 미팅 때 명확히 말씀드리겠습니다.","I'm sorry. Let me clarify it at the next meeting."],
  ["패턴 5","이 제안에 대해 어떻게 생각하세요?","What are your thoughts on this proposal?"],
  ["패턴 5","다른 의견이나 아이디어 있으세요?","Any other thoughts or ideas?"],
  ["패턴 6","우리는 아직 이 제품을 개발하는 중입니다.","We're still in the process of developing the product."],
  ["패턴 6","견적을 비교하는 중입니다.","We're still in the process of comparing quotations."],
  ["패턴 7","그분께 이메일을 보내야 할 것 같아요.","I would have to email him."],
  ["패턴 7","제가 다시 연락드려야 할 것 같아요.","I would have to get back to you."],
  ["패턴 7","주말에 그분께 이메일 보내셔야 할 거예요.","You would have to email him over the weekend."],
  ["패턴 8","제가 보기엔 1~2주 걸릴 것 같아요.","I would say that it will take a week or two."],
  ["패턴 8","제가 보기엔 시간이 더 필요해요.","I would say that I need more time."],
  ["패턴 8","제 관점에서는 시간이 더 필요합니다.","From my perspective, we need more time."],
  ["패턴 8","이것 좀 해 주셨으면 해요.","I would like you to do this for me."],
  ["패턴 9","저 시간이 부족해요.","I'm short on time."],
  ["패턴 9","우리 시간이 점점 부족해지고 있어요.","We're getting short on time."],
  ["패턴 9","우리 시간이 거의 다 되어 가요.","We're running short on time."],
  ["패턴 10","제 제안에 대해 생각해 보셨나요?","Have you given my offer some thought?"],
  ["패턴 10","더 생각해 보셨나요?","Have you given it any more thought?"],
  ["패턴 10","생각해 보시고 연락 주세요.","Please get back to me after you give it some thought."],
  ["패턴 10","생각해 보고 같이 결정해요.","Let's decide together after giving it some thought."],
  ["패턴 11","서면으로 필요하세요?","Do you need it in writing?"],
  ["패턴 11","NDA 같은 문서는 서면으로 남겨야 해요.","We have to put documents like an NDA in writing."],
  ["패턴 12","미팅을 제시간에 끝내는 것이 매우 중요해요.","It's essential that we finish the meeting on time."],
  ["패턴 12","이번 주까지 프로젝트를 끝내는 것이 매우 중요해요.","It's essential that we finish the project by this week."],
  ["패턴 12","모두가 정보를 알고 있도록 하는 것이 중요해요.","It's essential that we keep everyone informed."],
  ["패턴 13","미팅 일정을 다시 잡아야 할지도 몰라요.","We may have to reschedule our meeting."],
  ["패턴 13","이제 마무리해야 할 것 같아요.","We might have to wrap it up now."],
  ["패턴 13","마감을 미뤄야 할 수도 있어요.","We might have to push back the deadline."],
  ["어휘","여러 언어를 구사하는 사람","polyglot"],
  ["어휘","~에 푹 빠지다 / 몰입하다","immerse yourself in"],
  ["어휘","~에 귀 기울이다","tune in to"],
  ["어휘","힘들어도 꿋꿋이 계속하다","soldier on"],
  ["어휘","여러 일을 동시에 처리하다","juggle several things"],
  ["어휘","~하는 경향이 있다 (주로 나쁜 것)","be prone to"],
  ["어휘","코를 훌쩍이다","sniffle"],
  ["어휘","약화시키다, 줄이다","dampen"],
  ["어휘","(뒤에서 지켜보며) 압박하다","breathing down your neck"],
  ["어휘","변덕스러운, 불안정한","volatile"],
  ["어휘","가벼운 약속 vs 격식 있는 약속","arrangement vs appointment"],
  ["어휘","지속 가능한","sustainable"],
  ["어휘","금리","interest rate"],
  ["어휘","요약해서 되짚다","recap"],
  ["어휘","약관, 계약 조건","terms and conditions"],
  ["어휘","미루다 (3가지)","push back / postpone / delay"],
  ["어휘","불운을 막으려는 말 (영국식)","touch wood"]
];

var KEY = "ck-english-flashcards-v1";
var state = {};   // 영어문장 -> "ok" | "ng"
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

var $ = function (id) { return document.getElementById(id); };
var groups = ["전체"];
CARDS.forEach(function (c) { if (groups.indexOf(c[0]) < 0) groups.push(c[0]); });
$("set").innerHTML = groups.map(function (g) { return "<option>" + g + "</option>"; }).join("");

var deck = [], idx = 0, showA = false, onlyNg = false;

function build() {
  var g = $("set").value;
  deck = CARDS.filter(function (c) { return (g === "전체" || c[0] === g) && (!onlyNg || state[c[2]] === "ng"); });
  idx = 0; showA = false; render();
}
function render() {
  var okN = CARDS.filter(function (c) { return state[c[2]] === "ok"; }).length;
  $("stat").textContent = "외운 카드 " + okN + " / " + CARDS.length + (deck.length ? "   ·   이 덱 " + (idx + 1) + " / " + deck.length : "");
  if (!deck.length) { $("card").innerHTML = '<div class="q">카드가 없어요 🎉</div>'; return; }
  var c = deck[idx];
  $("card").innerHTML = '<div class="tag">' + c[0] + '</div>' +
    '<div class="q">' + c[1] + '</div>' +
    (showA ? '<div class="a" style="margin-top:18px">' + c[2] + '</div>' : '<div class="hint">눌러서 정답 보기</div>');
}
function next() { idx = (idx + 1) % deck.length; showA = false; render(); }
function mark(v) { if (!deck.length) return; state[deck[idx][2]] = v; save(); next(); }

$("card").onclick = function () { showA = !showA; render(); };
$("btnOk").onclick = function () { mark("ok"); };
$("btnNg").onclick = function () { mark("ng"); };
$("set").onchange = build;
$("shuffle").onclick = function () { deck.sort(function () { return Math.random() - .5; }); idx = 0; showA = false; render(); };
$("reviewNg").onclick = function () { onlyNg = !onlyNg; this.textContent = onlyNg ? "전체 보기" : "모르는 것만"; build(); };
$("speak").onclick = function () {
  if (!deck.length || !window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(deck[idx][2]); u.lang = "en-US"; speechSynthesis.speak(u);
};
build();
</script>
</body>
</html>
